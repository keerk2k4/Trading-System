<section class="auth-card">
  <h1>Sign in</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="login-username">Username</label>
    <input
      id="login-username"
      type="text"
      formControlName="username"
      data-testid="login-username"
      autocomplete="username"
    />

    <label for="login-password">Password</label>
    <input
      id="login-password"
      type="password"
      formControlName="password"
      data-testid="login-password"
      autocomplete="current-password"
    />

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" data-testid="login-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  <p class="switch-link"><a routerLink="/admin/login">Sign in as an administrator</a></p>
</section>
