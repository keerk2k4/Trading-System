spring:
  application:
    name: trade-executor

  # Kafka Configuration
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:trade-executor-group}
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      enable-idempotence: true
      retries: 10
      properties:
        max.in.flight.requests.per.connection: 5

  # PostgreSQL Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # MyBatis Configuration
  mybatis:
    configuration:
      map-underscore-to-camel-case: true
    type-aliases-package: com.tradeexecutor.entity

# Application-specific Configuration
app:
  # Fauxnance Configuration
  fauxnance:
    base-url: ${FAUXNANCE_BASE_URL}
    api-key: ${FAUXNANCE_API_KEY}
    retry:
      max-attempts: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:1}
      delay-ms: ${FAUXNANCE_RETRY_DELAY_MS:100}

  # Market Data Poller Configuration
  poller:
    poll-interval-ms: ${POLL_INTERVAL_SECONDS:30000}
    min-interval-ms: 30000

# Logging Configuration
logging:
  level:
    root: INFO
    com.tradeexecutor: DEBUG

