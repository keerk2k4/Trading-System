services:

  postgres:
    image: postgres:17
    container_name: trading-postgres
    profiles:
      - platform
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d trading]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
    image: postgres:17
    container_name: trading-migrations
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    volumes:
      - ./migrations:/workspace/migrations
      - ./seed:/workspace/seed
      - ./apply.sh:/workspace/apply.sh
    working_dir: /workspace
    entrypoint: [/bin/bash, /workspace/apply.sh]
    networks:
      - trading-net

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    profiles:
      - platform
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-256-bit-secret-key-for-hmac-sha256-token-signing
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge
