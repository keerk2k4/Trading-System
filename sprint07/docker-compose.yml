services:

  postgres:
    image: postgres:17
    container_name: trading-postgres
    profiles:
      - platform
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
    image: postgres:17
    container_name: trading-migrations
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    volumes:
      - ./migrations:/workspace/migrations
      - ./seed:/workspace/seed
      - ./apply.sh:/workspace/apply.sh
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/apply.sh"]
    networks:
      - trading-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    profiles:
      - platform

    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Don't automatically create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "9092:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 10s
      retries: 20

    networks:
      - trading-net

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    profiles:
      - platform

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092

    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]

    networks:
      - trading-net

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    profiles:
      - platform

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-256-bit-secret-key-for-hmac-sha256-token-signing

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy

      migrations:
        condition: service_completed_successfully

      kafka-init:
        condition: service_completed_successfully

    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge