services:

  postgres:
    image: postgres:17
    container_name: trading-postgres
    profiles:
      - platform
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d trading]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
    image: postgres:17
    container_name: trading-migrations
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    volumes:
      - ./migrations:/workspace/migrations
      - ./seed:/workspace/seed
      - ./apply.sh:/workspace/apply.sh
    working_dir: /workspace
    entrypoint: [/bin/bash, /workspace/apply.sh]
    networks:
      - trading-net

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    profiles:
      - platform
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-256-bit-secret-key-for-hmac-sha256-token-signing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - trading-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    profiles:
      - platform
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - trading-net

  kafka-topics:
    image: apache/kafka:4.0.0
    container_name: kafka-topics
    profiles:
      - platform
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./scripts/create-topics.sh:/workspace/create-topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
        /bin/bash /workspace/create-topics.sh
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge