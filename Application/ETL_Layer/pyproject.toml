[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-analytics-etl"
version = "0.1.0"
description = "Incremental PostgreSQL to DuckDB trade analytics load"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
trade-etl = "trade_etl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
