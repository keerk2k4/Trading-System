spring.application.name=spring-boot-app
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-hmac-sha256-token-signing}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.8.76.9:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:trade-api-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
app.kafka.topics.market-data=market-data
app.kafka.groups.watchlist-service=watchlist-service
app.kafka.topics.trade-events=trade-events
app.kafka.groups.notification-service=notification-service
app.kafka.topics.user-registrations=user-registrations
app.kafka.groups.account-provisioning=account-provisioning
# OpenAPI generated from the controllers: Swagger UI at /swagger-ui, JSON at /api-docs.
# Only the public /api/v1 surface is published; /internal/** stays out of the document.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.paths-to-match=/api/v1/**

# Health: only /actuator/health is exposed, and it answers UP or DOWN only, so
# load balancers and Docker can call it without a token and learn nothing else.
# It covers the database and Kafka (kafka/KafkaHealthIndicator). Answers are
# cached briefly so repeated calls do not each open a broker connection.
# /actuator/health/liveness and /readiness are for container restarts and
# traffic routing in the cloud deployment.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.cache.time-to-live=5s
management.endpoint.health.probes.enabled=true

# Where the admin health view (GET /api/v1/admin/health) asks the Trade
# Executor for its /actuator/health. Service to service only.
app.executor.url=${EXECUTOR_URL:http://localhost:8081}

# Where notification emails are sent from (POST /internal/notifications/email):
# auth-service owns the customer's address and the SMTP settings, so an alert
# on the EMAIL channel ("In app and email") is handed to it. Service to service only.
app.auth.url=${AUTH_SERVICE_URL:http://localhost:3000}

# Each Kafka health check opens a short-lived admin client, and the Kafka
# library logs its whole configuration and version at INFO every time. Those
# two loggers are kept to warnings; connection failures still appear.
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN
logging.level.org.apache.kafka.common.utils.AppInfoParser=WARN

# Portfolio and P&L (contracts/portfolio-api.yaml). Prices come from the
# market-data topic; a quote not refreshed within max-age is served marked
# stale. The poller runs every 120 s, so 5 minutes allows one missed poll.
# All instruments are quoted in USD and no FX conversion is done.
portfolio.price.max-age=PT5M
portfolio.base-currency=USD
