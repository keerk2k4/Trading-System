server:
  port: 8081

spring:
  application:
    name: trade-executor

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:trade-executor-group}
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      enable-idempotence: true
      retries: 10
      properties:
        max.in.flight.requests.per.connection: 5

  # PostgreSQL Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # MyBatis Configuration
  mybatis:
    configuration:
      map-underscore-to-camel-case: true
    type-aliases-package: com.tradeexecutor.entity

# Application-specific Configuration
app:
  # Dead-Letter Queue (DLT) Configuration
  # Handles permanent and transient failures for Kafka consumers
  dlt:
    # Maximum number of retry attempts for transient failures before DLT
    max-retries: ${APP_DLT_MAX_RETRIES:3}
    
    # Initial backoff delay in milliseconds (first retry)
    initial-backoff-ms: ${APP_DLT_INITIAL_BACKOFF_MS:100}
    
    # Exponential backoff multiplier (backoff doubles each retry)
    backoff-multiplier: ${APP_DLT_BACKOFF_MULTIPLIER:2.0}
    
    # Maximum backoff delay in milliseconds (cap for exponential growth)
    max-backoff-ms: ${APP_DLT_MAX_BACKOFF_MS:30000}
  
  # Fauxnance Configuration
  fauxnance:
    base-url: ${FAUXNANCE_BASE_URL}
    api-key: ${FAUXNANCE_API_KEY}
    retry:
      max-attempts: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:1}
      delay-ms: ${FAUXNANCE_RETRY_DELAY_MS:100}

  # Market Data Poller Configuration
  poller:
    poll-interval-ms: ${POLL_INTERVAL_SECONDS:30000}
    min-interval-ms: 30000

  # Order execution timing (contracts/kafka-topics.md "Execution timing").
  # MARKET orders execute immediately; LIMIT orders wait limit-delay-ms in NEW
  # so they can be cancelled (DELETE) or updated (PATCH) first.
  execution:
    limit-delay-ms: ${APP_EXECUTION_LIMIT_DELAY_MS:15000}

  # Holdings settlement timing (contracts/trade-api.yaml positions description).
  # A FILLED order settles cash + positions immediately; holdings (demat)
  # follow after holdings-delay-ms via trading.settlement_jobs.
  settlement:
    holdings-delay-ms: ${APP_SETTLEMENT_HOLDINGS_DELAY_MS:15000}
    optimistic-lock-retries: ${APP_SETTLEMENT_RETRIES:3}

# Health: only the health endpoint is exposed. /actuator/health answers UP or
# DOWN only, for load balancers and container restarts. It covers the database
# and Kafka (kafka/KafkaHealthIndicator). The Trade API reads the dependencies
# group below to build the admin dashboard's service-health view; the browser
# never calls this service. Answers are cached briefly so repeated calls do
# not each open a broker connection.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      cache:
        time-to-live: 5s
      probes:
        enabled: true
      # /actuator/health/dependencies names which dependency is failing
      # (db, kafka) with UP/DOWN only, no details, so the Trade API can report
      # "running, but can't reach Kafka" rather than "down". It is read service
      # to service only; this executor serves nothing to browsers.
      group:
        dependencies:
          include: db,kafka
          show-components: always
          show-details: never

# Logging Configuration
logging:
  level:
    root: INFO
    # Each Kafka health check opens a short-lived admin client, and the Kafka
    # library logs its whole configuration and version at INFO every time.
    # Kept to warnings; connection failures still appear.
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
    com.tradeexecutor: DEBUG

