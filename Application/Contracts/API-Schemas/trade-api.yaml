openapi: 3.1.0

info:
  title: Trade REST API
  version: 1.0.0
  summary: Order placement, order cancellation and account queries for the Enterprise Trading Platform.
  description: |
    Binding contract for the Sprint 6 Spring Boot service. Implement it exactly. The Angular UI
    generates its typed client from this file, so a field renamed here is a compile error there.

    ## Identifiers

    `accountId` means the numeric surrogate key `ACCOUNTS.id` everywhere in this contract: in
    path parameters and in the JWT `accountId` claim. The string business
    identifier lives on `ACCOUNTS.account_id` and is returned as `AccountResponse.accountId`, which
    is the one place the name carries the other meaning. Where any other material uses the name
    loosely, this contract is the one that binds.

    ## Order lifecycle and the Sprint 7 change

    In Sprint 6 there is no Trade Executor, so `POST /api/v1/orders` validates, fills and persists
    inside one request and returns `FILLED` or `REJECTED`.

    From Sprint 7 execution is asynchronous. The endpoint validates, persists the order with status
    `NEW`, publishes it to the `orders` Kafka topic and returns `NEW`. The Trade Executor consumes
    the order, prices it against a live Fauxnance quote, applies the fill rules, updates the order,
    the cash balance and the position in one database transaction, and publishes the outcome to
    `trade-events`.

    Both behaviours are valid responses under this contract. Clients must handle an order that is
    still `NEW` when the response arrives.

    ## Business rules

    Enforced in the order given. The first failure wins and no later rule is evaluated.

    | # | Rule | Error |
    |---|---|---|
    | 1 | The account must exist | `ACC-404`, 404 |
    | 2 | The account must be `ACTIVE` | `ACC-403`, 403 |
    | 3 | The instrument must exist and be tradable | `INS-404`, 404 |
    | 4 | Quantity must be greater than zero | `VAL-422`, 422 |
    | 5 | LIMIT: price must be greater than zero; MARKET: omit price | `VAL-422`, 422 |
    | 6 | BUY: cash balance must be at least quantity multiplied by validation price | `ORD-400`, 400 |
    | 7 | SELL: held quantity must be at least the order quantity | `ORD-409`, 409 |
    | 8 | The idempotency key must be unique | `ORD-409`, 409 |

    Rules 9 and 10 have no error code. Cash and position update atomically, in one transaction.
    Every order is recorded, including rejected ones, because the order table is the audit trail.

    Rule 8 is enforced by the unique constraint on `orders.idempotency_key`, not by a read followed
    by a write. A read-then-write check has a race that two concurrent requests will find.

    ## Authentication

    Every `/api/v1/**` route requires a valid signed JWT in the `Authorization` header. A missing,
    malformed, expired or wrongly signed token is `AUTH-401`, 401. A valid token whose `accountId`
    claim does not match the account being addressed is `ACC-403`, 403: a token proves who you are,
    not what you may reach.
  contact:
    name: Enterprise Trading Platform, programme materials
  license:
    name: Instructional use only

servers:
  - url: http://trade-api:8080
    description: Service name inside the Docker Compose network
  - url: http://localhost:8080
    description: Local development, run from Docker Compose

tags:
  - name: Orders
    description: Placing and cancelling orders.
  - name: Strategies
    description: Quote-triggered strategy rules that submit market orders.
  - name: Accounts
    description: Account details, cash balance, holdings and order history.
  - name: Positions
    description: Unsettled positions and settled holdings.
  - name: Preferences
    description: Default account and alert channel for the signed-in customer.
  - name: Notifications
    description: Notification inbox fed by trade-events outcomes.
  - name: Watchlists
    description: Database-backed watchlists enriched with live market-data prices.

security:
  - bearerAuth: []

paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order
      description: |
        Validates the request against business rules 1 to 8 and records the order. Returns `NEW`
        once the Trade Executor exists, or the terminal status when the service fills synchronously
        in Sprint 6.

        Retrying with the same `idempotencyKey` is not a way to poll for status. It returns
        `ORD-409`. Poll `GET /api/v1/accounts/{id}/orders` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            examples:
              buy:
                summary: Buy 100 shares
                value:
                  orderType: LIMIT
                  symbol: ACME
                  side: BUY
                  quantity: 100
                  price: 25.50
                  idempotencyKey: 6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
              marketBuy:
                summary: Buy at market
                value:
                  orderType: MARKET
                  symbol: ACME
                  side: BUY
                  quantity: 100
                  idempotencyKey: 6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5f
      responses:
        '200':
          description: Order accepted and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                accepted:
                  summary: Sprint 7 onwards, asynchronous execution
                  value:
                    orderId: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
                    status: NEW
                    message: Order accepted
                    symbol: ACME
                    side: BUY
                    quantity: 100
                    price: 25.50
                filled:
                  summary: Sprint 6 only, synchronous execution
                  value:
                    orderId: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
                    status: FILLED
                    message: Order executed
                    symbol: ACME
                    side: BUY
                    quantity: 100
                    price: 25.50
        '400':
          $ref: '#/components/responses/InsufficientFunds'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: The account or the instrument does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountMissing:
                  value:
                    errorCode: ACC-404
                    message: Account not found
                instrumentMissing:
                  value:
                    errorCode: INS-404
                    message: Instrument not found
        '409':
          description: Insufficient holdings for a sell, or the idempotency key has been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                holdings:
                  value:
                    errorCode: ORD-409
                    message: Insufficient holdings
                duplicate:
                  value:
                    errorCode: ORD-409
                    message: Duplicate order
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/orders/{id}:
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel a working order
      description: |
        Cancels an order that is still `NEW` and returns the updated order. An order that is already
        `FILLED`, `REJECTED` or `CANCELLED` cannot be cancelled and returns `ORD-409`.

        Timing: `MARKET` orders are executed immediately by the Trade Executor, so they are
        cancellable only for a brief instant after acceptance. `LIMIT` orders wait
        `app.execution.limit-delay-ms` (15s by default) in `NEW` before the executor prices
        them, which is the window where cancel and update succeed.

        The cancellation is a state transition guarded inside the database transaction. Checking the
        status, then updating it, without a guarded transition, races the Trade Executor.
      parameters:
        - name: id
          in: path
          required: true
          description: The order UUID, without the `ORD-` display prefix.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                cancelled:
                  value:
                    orderId: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
                    status: CANCELLED
                    message: Order cancelled
                    symbol: ACME
                    side: BUY
                    quantity: 100
                    price: 25.50
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: No order exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    errorCode: ORD-409
                    message: Order not found
        '409':
          description: The order is not in a cancellable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyFilled:
                  value:
                    errorCode: ORD-409
                    message: Order is not cancellable
    patch:
      tags: [Orders]
      operationId: updateOrder
      summary: Update a working order
      description: |
        Updates quantity and/or limit price of an order that is still `NEW` and returns the
        updated order. Only `LIMIT` orders can be updated, and only while `NEW`. A `MARKET`
        order carries no limit price so only its quantity could change, and since market
        orders execute immediately the window is effectively zero; implementations reject
        price updates on `MARKET` orders with `VAL-422`.

        The update re-validates business rules 4-7 against the new values, then applies a
        guarded transition (`WHERE id = ? AND status = 'NEW'`) so it races safely with the
        Trade Executor. The executor always re-reads the order row after the
        `LIMIT` delay, so an accepted update is what gets priced.
      parameters:
        - name: id
          in: path
          required: true
          description: The order identifier, without the `ORD-` display prefix.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated, still working.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: No order exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    errorCode: ORD-409
                    message: Order not found
        '409':
          description: The order is not in an updatable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyFilled:
                  value:
                    errorCode: ORD-409
                    message: Order is not cancellable
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get account details
      description: |
        Legacy route. The backend resolves the effective account from JWT claims and does not trust
        caller-supplied account identifiers.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/{id}/balance:
    get:
      tags: [Accounts]
      operationId: getBalance
      summary: Get cash balance
      description: |
        Legacy route. The backend resolves the effective account from JWT claims and does not trust
        caller-supplied account identifiers.

        Returns available cash only. It does not include the market value of holdings. Portfolio
        valuation is the Sprint 10 Portfolio and P&L extension, contracted separately.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Cash balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/me:
    get:
      tags: [Accounts]
      operationId: getMyAccount
      summary: Get account details for the signed-in user
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/me/balance:
    get:
      tags: [Accounts]
      operationId: getMyBalance
      summary: Get cash balance for the signed-in user
      responses:
        '200':
          description: Cash balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

    patch:
      tags: [Accounts]
      operationId: updateMyBalance
      summary: Update cash balance for the signed-in account
      description: |
        Sets the available cash balance for the account identified by the JWT `accountId` claim.
        No account identifier is accepted from query or path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceUpdateRequest'
            examples:
              deposit:
                value:
                  cashBalance: 2500.25
      responses:
        '200':
          description: Updated cash balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: Concurrent account update conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    errorCode: ORD-409
                    message: Order conflict
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/accounts/{id}/positions:
    get:
      tags: [Accounts]
      operationId: getPositions
      summary: Get holdings
      description: |
        Legacy route. The backend resolves the effective account from JWT claims and does not trust
        caller-supplied account identifiers.

        Net held quantity and average cost per instrument. Positions with a net quantity of zero are
        not returned. Market value is not calculated here; it needs a live quote and belongs to the
        Portfolio and P&L extension.

        Settlement: a FILLED order updates positions immediately. Holdings (demat) follow after
        `app.settlement.holdings-delay-ms` (15s by default); a background settlement job moves
        the filled quantity from positions to holdings and persists both legs in the database.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Holdings for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionResponse'
              examples:
                holdings:
                  value:
                    - accountId: 1
                      symbol: ACME
                      quantity: 100
                      averageCost: 25.50
                    - accountId: 1
                      symbol: INFY.NS
                      quantity: 40
                      averageCost: 1580.25
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/{id}/orders:
    get:
      tags: [Accounts]
      operationId: getOrders
      summary: Get order history
      description: |
        Legacy route. The backend resolves the effective account from JWT claims and does not trust
        caller-supplied account identifiers.

        Every order recorded against the account, newest first, including rejected and cancelled
        ones. This is the audit trail and it is never filtered by default.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - name: status
          in: query
          required: false
          description: Restrict to one order status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: from
          in: query
          required: false
          description: Include orders created on or after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Include orders created on or before this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Order history for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/me/positions:
    get:
      tags: [Accounts]
      operationId: getMyPositions
      summary: Get holdings for the signed-in user
      responses:
        '200':
          description: Holdings for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/{id}/holdings:
    get:
      tags: [Accounts]
      operationId: getHoldings
      summary: Get settled holdings
      description: |
        Legacy route. The backend resolves the effective account from JWT claims and does not trust
        caller-supplied account identifiers.

        Settled (demat) holdings only. A filled DELIVERY buy lands in positions first and is
        moved here after the settlement window (about 15 seconds), when its positions row is
        removed; sells of settled shares debit here at fill time. INTRADAY fills never appear
        here. Zero-quantity rows are not returned.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Settled holdings for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/accounts/me/holdings:
    get:
      tags: [Accounts]
      operationId: getMyHoldings
      summary: Get settled holdings for the signed-in user
      responses:
        '200':
          description: Settled holdings for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/strategies:
    get:
      tags: [Strategies]
      operationId: getMyStrategies
      summary: List my quote-triggered strategy rules
      description: |
        JWT-derived identity only: strategies are always read for the signed-in
        account and never by caller-supplied account id.
      responses:
        '200':
          description: Strategy rules owned by the signed-in customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategyPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    post:
      tags: [Strategies]
      operationId: createStrategy
      summary: Create a quote-triggered strategy rule
      description: |
        Creates a strategy that watches live market-data quotes. When its
        trigger condition is matched, the backend submits a MARKET order on
        behalf of the signed-in account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRequest'
      responses:
        '200':
          description: Strategy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/strategies/{strategyId}:
    delete:
      tags: [Strategies]
      operationId: cancelStrategy
      summary: Cancel one strategy rule
      parameters:
        - name: strategyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Strategy cancelled.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          description: Strategy not found for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                strategyMissing:
                  value:
                    errorCode: STR-404
                    message: Strategy not found

  /api/v1/preferences/me:
    get:
      tags: [Preferences]
      operationId: getMyPreferences
      summary: Get my preferences, or the documented defaults when nothing is stored
      description: |
        JWT-derived identity only: the account comes from the verified token, so there is no
        path id to mismatch. A missing row is not a 404; the documented defaults are
        returned (alert channel PUSH -- in app only, no default account).
      responses:
        '200':
          description: Preferences for the signed-in customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    put:
      tags: [Preferences]
      operationId: updateMyPreferences
      summary: Create or update my preferences
      description: |
        Partial update: default account and/or alert channel. A default account must exist
        and belong to the caller's holder, otherwise VAL-422. Contact details are never
        stored here; auth-service owns them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferenceRequest'
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/notifications/me:
    get:
      tags: [Notifications]
      operationId: getMyNotifications
      summary: List my notifications, newest first
      description: |
        JWT-derived identity only: history is read for the token's account, so a token for
        one account can never reach another's notifications. The recorded channel is the one
        the message was actually routed on. Backend source of truth for the inbox.
      responses:
        '200':
          description: Notification history for the signed-in customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/watchlists:
    get:
      tags: [Watchlists]
      operationId: getWatchlists
      summary: List the signed-in user's watchlists
      description: |
        Persistent watchlists from PostgreSQL (trading.watchlist /
        trading.watchlist_inst). Ownership is resolved from the JWT
        `accountId` claim; watchlists are isolated between users. The default
        watchlist is created on demand if missing.
      responses:
        '200':
          description: Watchlists for the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    post:
      tags: [Watchlists]
      operationId: createWatchlist
      summary: Create a watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchlistRequest'
      responses:
        '201':
          description: Watchlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: A watchlist with that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/watchlists/{watchlistId}:
    get:
      tags: [Watchlists]
      operationId: getWatchlist
      summary: Get one watchlist with live prices
      description: |
        Persistent membership from PostgreSQL combined with the latest
        `market-data` quote from the backend in-memory cache. Live
        price/change values are never persisted.
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Watchlist detail with live prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: Watchlist or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Watchlists]
      operationId: deleteWatchlist
      summary: Delete a non-default watchlist
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Watchlist deleted.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: Watchlist or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The default watchlist cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/watchlists/{watchlistId}/instruments:
    post:
      tags: [Watchlists]
      operationId: addWatchlistInstrument
      summary: Add an instrument to a watchlist
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWatchlistInstrumentRequest'
      responses:
        '201':
          description: Instrument added with live price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistStockResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: Watchlist, account or instrument not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/watchlists/{watchlistId}/instruments/{symbol}:
    delete:
      tags: [Watchlists]
      operationId: removeWatchlistInstrument
      summary: Remove an instrument from a watchlist
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Instrument removed.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotActive'
        '404':
          description: Watchlist or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/instruments:
    get:
      tags: [Watchlists]
      operationId: searchInstruments
      summary: Search tradable instruments with live prices
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching instruments with live prices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /api/v1/instruments/{symbol}/quote:
    get:
      tags: [Watchlists]
      operationId: getQuote
      summary: Get the latest live quote for one symbol
      description: |
        Returns the newest `market-data` quote held in the backend in-memory cache, which is
        what a `MARKET` order is validated and priced against. The order ticket calls this
        when the trader selects `MARKET` so the current value loads immediately. Null
        bid/ask means no executable quote yet and a market order would be rejected.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest cached quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          description: No live quote cached for that symbol yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/me/orders:
    get:
      tags: [Accounts]
      operationId: getMyOrders
      summary: Get order history for the signed-in user
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict to one order status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: from
          in: query
          required: false
          description: Include orders created on or after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Include orders created on or before this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Order history for the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/AccountNotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by the auth service. The claims contract is defined in `auth-api.yaml`.

  parameters:
    AccountIdPath:
      name: id
      in: path
      required: true
      description: The numeric account key, `ACCOUNTS.id`.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    AccountNotFound:
      description: No account exists with that key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: ACC-404
                message: Account not found
    AccountNotActive:
      description: The account is SUSPENDED or CLOSED, or the token does not grant access to it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notActive:
              value:
                errorCode: ACC-403
                message: Account not active
    InsufficientFunds:
      description: A buy order costs more than the available cash balance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            funds:
              value:
                errorCode: ORD-400
                message: Insufficient funds
    InvalidInput:
      description: The request failed field validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input

  schemas:

    OrderSide:
      type: string
      enum: [BUY, SELL]
      description: Direction of the order.

    PlaceOrderType:
      type: string
      enum: [LIMIT, MARKET]
      description: |
        Supported order-entry types on `POST /api/v1/orders`.
        LIMIT requires `price`; MARKET must omit `price`.

    StrategyStatus:
      type: string
      enum: [ACTIVE, TRIGGERING, TRIGGERED, CANCELLED]
      description: |
        ACTIVE rules are evaluated on each quote. TRIGGERING means a matching
        quote is currently creating an order. TRIGGERED and CANCELLED are
        terminal.

    OrderStatus:
      type: string
      enum: [NEW, FILLED, REJECTED, CANCELLED]
      description: |
        `NEW` is the working state, held from acceptance until the Trade Executor resolves it.
        `FILLED`, `REJECTED` and `CANCELLED` are terminal. There is no partial-fill state, so the
        Trade Executor fills an order in full or rejects it.

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, BLOCKED, CLOSED]
      description: |
        Only an ACTIVE account may place or cancel orders. `PENDING` is the status a newly
        registered user's account is created in, before KYC is approved; the Auth Service's
        `PATCH /kyc` review endpoint moves it to `ACTIVE` on approval. `BLOCKED` and `SUSPENDED`
        are both non-trading holds; `CLOSED` is terminal.

    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, quantity, idempotencyKey]
      properties:
        orderType:
          allOf:
            - $ref: '#/components/schemas/PlaceOrderType'
          default: LIMIT
        symbol:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Instrument symbol, matching `INSTRUMENTS.symbol` and the Fauxnance symbol scheme:
            a plain ticker for US equities, a `.NS` or `.BO` suffix for NSE or BSE, `FX:` for a
            currency pair, `X:` for crypto.
          examples: [ACME, AAPL, INFY.NS, 'FX:EURUSD']
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Whole units. Must be greater than zero, business rule 4.
          example: 100
        price:
          type: [number, 'null']
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: |
            LIMIT only: limit price per unit, to two decimal places.
            Omit or set null for MARKET orders.
            Serialise as a JSON number and hold it as `BigDecimal` in Java. Never use `double` for
            money in the domain.
          example: 25.50
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
          description: |
            Client-generated unique request identifier, normally a UUID. Enforced by a unique
            constraint on `orders.idempotency_key`. Reuse returns `ORD-409`.
          example: 6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e

    UpdateOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: New whole-unit quantity. Must be greater than zero.
          example: 150
        price:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: |
            New limit price per unit. Only for `LIMIT` orders; rejected with `VAL-422` on
            `MARKET` orders.
          example: 26.00

    OrderResponse:
      type: object
      additionalProperties: false
      required: [orderId, status, message, symbol, side, quantity]
      properties:
        orderId:
          type: string
          description: The order identifier, displayed with an `ORD-` prefix over the stored identifier.
          example: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
        status:
          $ref: '#/components/schemas/OrderStatus'
        message:
          type: string
          description: Human-readable outcome. For display only. Never branch on this string.
          example: Order accepted
        symbol:
          type: string
          example: ACME
        side:
          $ref: '#/components/schemas/OrderSide'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
          format: int32
          example: 100
        price:
          type: [number, 'null']
          format: double
          description: LIMIT price when provided; null for MARKET orders.
          example: 25.50

    OrderHistoryEntry:
      type: object
      additionalProperties: false
      required: [orderId, accountId, symbol, side, quantity, status, createdOn]
      properties:
        orderId:
          type: string
          example: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
        accountId:
          type: integer
          format: int64
          example: 1
        symbol:
          type: string
          example: ACME
        side:
          $ref: '#/components/schemas/OrderSide'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
          format: int32
          example: 100
        price:
          type: [number, 'null']
          format: double
          description: The limit price submitted with the order.
          example: 25.50
        executedPrice:
          type: [number, 'null']
          format: double
          description: The price the Trade Executor filled at. Null until the order is FILLED.
          example: 25.48
        status:
          $ref: '#/components/schemas/OrderStatus'
        idempotencyKey:
          type: string
          example: 6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
        createdOn:
          type: string
          format: date-time
          example: '2026-09-28T09:14:22Z'
        realizedPnl:
          type: [number, 'null']
          format: double
          description: |
            Realised profit or loss, to two decimal places, using the weighted average cost method:
            (executedPrice - average cost) x quantity, where average cost is the position's
            averageCost at the moment the SELL was filled. Set only on FILLED SELL orders; null for
            BUY orders, unfilled orders and sells whose cost basis is unknown.
          example: -0.50
        realizedPnlPercent:
          type: [number, 'null']
          format: double
          description: |
            realizedPnl / (average cost x quantity) x 100, to two decimal places. Null whenever
            realizedPnl is null.
          example: -0.26

    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, accountId, holderName, cashBalance, status, version, lastUpdated]
      properties:
        id:
          type: integer
          format: int64
          description: The numeric account key. This is what every other endpoint calls `accountId`.
          example: 1
        accountId:
          type: string
          maxLength: 32
          description: |
            The business account identifier, `ACCOUNTS.account_id`. This is the one field in the
            contract where the name `accountId` means the string identifier rather than the numeric
            key. It exists because the source domain model defines both.
          example: ACC-000001
        holderName:
          type: string
          example: Priya Menon
        cashBalance:
          type: number
          format: double
          description: Available cash, to two decimal places.
          example: 24500.75
        status:
          $ref: '#/components/schemas/AccountStatus'
        version:
          type: integer
          format: int32
          description: Optimistic lock version. Increments on every write to the account row.
          example: 7
        lastUpdated:
          type: string
          format: date-time
          example: '2026-09-28T09:14:22Z'

    BalanceResponse:
      type: object
      additionalProperties: false
      required: [accountId, cashBalance, currency, asOf]
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        cashBalance:
          type: number
          format: double
          example: 24500.75
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code.
          example: USD
        asOf:
          type: string
          format: date-time
          example: '2026-09-28T09:14:22Z'

    BalanceUpdateRequest:
      type: object
      additionalProperties: false
      required: [cashBalance]
      properties:
        cashBalance:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: New available cash balance to persist for the signed-in account.
          example: 2500.25

    PositionResponse:
      type: object
      additionalProperties: false
      required: [accountId, symbol, quantity, averageCost]
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        symbol:
          type: string
          example: ACME
        quantity:
          type: integer
          format: int32
          description: Net held quantity. Never negative; short selling is out of scope.
          minimum: 0
          example: 100
        averageCost:
          type: number
          format: double
          description: |
            Weighted average cost basis per unit. A buy recalculates it. A sell reduces quantity and
            leaves it unchanged, which is what makes realised profit and loss computable later.
          example: 25.50
        currentPrice:
          type: [number, 'null']
          format: double
          description: Latest market-data price from the backend cache. Null when no quote seen yet.
          example: 245.30
        marketValue:
          type: [number, 'null']
          format: double
          description: quantity multiplied by currentPrice. Null when no quote seen yet.
          example: 2453.00
        unrealizedPnl:
          type: [number, 'null']
          format: double
          description: |
            (currentPrice - averageCost) x quantity, to two decimal places. Null when no quote seen yet.
          example: 200.00
        unrealizedPnlPercent:
          type: [number, 'null']
          format: double
          description: unrealizedPnl / (averageCost x quantity) x 100, to two decimal places. Null when no quote seen yet.
          example: 8.00

    HoldingResponse:
      type: object
      additionalProperties: false
      required: [accountId, symbol, quantity, averageCost]
      description: |
        Settled (demat) holdings. Same enrichment as positions; rows here have completed
        the settlement window, so their positions rows are gone.
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        symbol:
          type: string
          example: ACME
        quantity:
          type: integer
          format: int32
          minimum: 0
          example: 100
        averageCost:
          type: number
          format: double
          example: 25.50
        currentPrice:
          type: [number, 'null']
          format: double
          example: 245.30
        marketValue:
          type: [number, 'null']
          format: double
          example: 2453.00
        unrealizedPnl:
          type: [number, 'null']
          format: double
          example: 200.00
        unrealizedPnlPercent:
          type: [number, 'null']
          format: double
          example: 8.00

    AlertChannel:
      type: string
      enum: [EMAIL, SMS, PUSH]
      description: |
        Channel a notification is delivered on, resolved from customer preferences on every
        send. Every notification is shown in the app; EMAIL also emails it ("In app and email"),
        PUSH does not ("In app only"). Documented default when nothing is stored: PUSH.

    NotificationType:
      type: string
      enum: [ORDER_FILLED, ORDER_REJECTED, ORDER_CANCELLED, PRICE_ALERT]
      description: What the notification is about.

    NotificationStatus:
      type: string
      enum: [QUEUED, SENT, FAILED]
      description: |
        Delivery ledger state, tracked separately from the Kafka offset. QUEUED means durably
        recorded; SENT/FAILED is the delivery outcome.

    PreferenceResponse:
      type: object
      additionalProperties: false
      required: [accountId, alertChannel]
      properties:
        accountId:
          type: integer
          format: int64
          example: 6
        defaultAccountId:
          type: [integer, 'null']
          format: int64
          description: Reference to the customer's default trading account. Null when unset.
          example: 6
        alertChannel:
          $ref: '#/components/schemas/AlertChannel'

    UpdatePreferenceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        defaultAccountId:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the caller's holder, otherwise VAL-422.
          example: 6
        alertChannel:
          $ref: '#/components/schemas/AlertChannel'

    NotificationResponse:
      type: object
      additionalProperties: false
      required: [notificationId, eventId, accountId, type, title, message, channel, status, createdOn]
      properties:
        notificationId:
          type: integer
          format: int64
          example: 101
        eventId:
          type: string
          description: The Kafka eventId; redeliveries of it are no-ops.
          example: d47f9a10-3e2b-4c88-b0a1-7e6d5c4b3a29
        accountId:
          type: integer
          format: int64
          example: 6
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: 'Order filled: ACME'
        message:
          type: string
          description: Order facts only; never credentials or contact details.
          example: Your order for 10 ACME (BUY) has been filled at 25.50.
        channel:
          $ref: '#/components/schemas/AlertChannel'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        createdOn:
          type: string
          format: date-time
          example: '2026-10-07T09:14:22Z'
        sentOn:
          type: [string, 'null']
          format: date-time

    WatchlistResponse:
      type: object
      additionalProperties: false
      required: [id, name, isDefault, symbols]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Default
        isDefault:
          type: boolean
          example: true
        symbols:
          type: array
          items:
            type: string
          example: [AAPL, MSFT]

    WatchlistDetailResponse:
      type: object
      additionalProperties: false
      required: [id, name, isDefault, stocks]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        isDefault:
          type: boolean
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistStockResponse'

    WatchlistStockResponse:
      type: object
      additionalProperties: false
      required: [symbol, name, price, change, changePercent]
      properties:
        symbol:
          type: string
          example: AAPL
        name:
          type: string
          example: Apple Inc.
        price:
          type: number
          format: double
          description: Latest market-data price; reference instruments.price when no quote yet.
          example: 245.30
        change:
          type: number
          format: double
          example: 1.25
        changePercent:
          type: number
          format: double
          example: 0.51

    CreateWatchlistRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
          example: Technology

    AddWatchlistInstrumentRequest:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol:
          type: string
          maxLength: 20
          example: AAPL

    CreateStrategyRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, targetPrice, quantity]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 20
          example: GOOGL
        side:
          $ref: '#/components/schemas/OrderSide'
        targetPrice:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 300.00
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 5

    StrategyPreferenceResponse:
      type: object
      additionalProperties: false
      required: [strategyId, symbol, side, targetPrice, quantity, status, createdOn]
      properties:
        strategyId:
          type: integer
          format: int64
          example: 42
        symbol:
          type: string
          example: GOOGL
        side:
          $ref: '#/components/schemas/OrderSide'
        targetPrice:
          type: number
          format: double
          example: 300.00
        quantity:
          type: integer
          format: int32
          example: 5
        status:
          $ref: '#/components/schemas/StrategyStatus'
        triggeredOrderId:
          type: [string, 'null']
          example: ORD-6f2b1c2a-6a1e-4a4f-9c0d-2f7a1b3c4d5e
        createdOn:
          type: string
          format: date-time
          example: '2026-10-07T09:14:22Z'
        triggeredOn:
          type: [string, 'null']
          format: date-time

    InstrumentResponse:
      type: object
      additionalProperties: false
      required: [symbol, name, price, change, changePercent]
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
        change:
          type: number
          format: double
        changePercent:
          type: number
          format: double

    QuoteResponse:
      type: object
      additionalProperties: false
      required: [symbol, price]
      properties:
        symbol:
          type: string
          example: AAPL
        price:
          type: number
          format: double
          description: Last cached price; the value pre-filled on a MARKET ticket.
          example: 245.30
        bid:
          type: [number, 'null']
          format: double
          description: Price a market SELL executes at. Null when no executable quote.
        ask:
          type: [number, 'null']
          format: double
          description: Price a market BUY executes at. Null when no executable quote.
        currency:
          type: string
          example: USD
        change:
          type: [number, 'null']
          format: double
        changePercent:
          type: [number, 'null']
          format: double

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The single error envelope for every failure. Clients branch on `errorCode`, never on
        `message` and never on the HTTP status alone, since 404 and 409 each carry two codes.
      properties:
        errorCode:
          type: string
          enum: [ACC-404, ACC-403, INS-404, ORD-400, ORD-409, STR-404, VAL-422, AUTH-401]
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `ACC-404` | 404 | Account not found |
            | `ACC-403` | 403 | Account not active, or not reachable with this token |
            | `INS-404` | 404 | Instrument not found or not tradable |
            | `ORD-400` | 400 | Insufficient funds |
            | `ORD-409` | 409 | Insufficient holdings, duplicate order, or order not cancellable |
            | `STR-404` | 404 | Strategy not found |
