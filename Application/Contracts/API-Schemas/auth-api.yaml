openapi: 3.1.0

info:
  title: Auth service
  version: 1.0.0
  summary: Registration, login, token refresh, KYC and current-user lookup for the Enterprise Trading Platform.
  description: |
    Binding contract for the NestJS auth service. The Trade REST API and Angular UI must depend on
    this contract rather than on implementation details.

    ## JWT claims contract

    This section is normative. A token that does not carry exactly these claims breaks the Trade
    REST API's authorisation check.

    | Claim | Type | Meaning |
    |---|---|---|
    | `sub` | string | The user identifier. A UUID. Stable for the life of the user. Not the username, not the email, because both can change. |
    | `accountId` | integer | The numeric trading account key, `ACCOUNTS.id`. The Trade REST API compares this against the account in the request path or body and returns `ACC-403` if they differ. `0` for an admin token, which is not tied to a trading account. |
    | `roles` | array of string | Authorisation roles. `CUSTOMER` for a normal trading user, `ADMIN` for an operator. Always present, never empty. |
    | `iat` | integer | Issued-at, seconds since the Unix epoch. |
    | `exp` | integer | Expiry, seconds since the Unix epoch. Fifteen minutes after `iat` for an access token. |
    | `iss` | string | Issuer. Use `auth-service`. Consumers must validate the configured issuer. |

    Decoded example:

    ```json
    {
      "sub": "8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f",
      "accountId": 1,
      "roles": ["CUSTOMER"],
      "iat": 1790000000,
      "exp": 1790000900,
      "iss": "auth-service"
    }
    ```

    Signing: `HS256` with a shared secret, read from `JWT_SECRET`. The auth service and Trade REST
    API must use the same algorithm and secret. Move to `RS256` with a published public key if a
    team wants the Trade REST API to verify without holding the signing secret. That is a
    documented upgrade, not a requirement.

    Lifetimes: access token 15 minutes, refresh token 7 days. Access tokens are not revocable, which
    is why they are short. Refresh tokens are stored and can be revoked.

    ## Registration and account provisioning

    Registration no longer takes a caller-supplied `accountId`. `POST /auth/register` creates the
    user record only, assigns the `CUSTOMER` role, and publishes a `user-registrations` Kafka event.
    The Trade REST API consumes that event asynchronously and provisions a new trading account for
    the user with `accountStatus = PENDING`. Because provisioning is asynchronous, the account may
    not exist yet at the instant registration returns `201` — `UserResponse` does not include an
    `accountId` at registration time.

    A user cannot log in successfully until that account exists: `POST /auth/login` looks the
    account up and fails with `AUTH-401` if none is found yet. The account also stays `PENDING`,
    and cannot trade, until an admin approves the user's KYC submission (see the KYC endpoints
    below), which moves it to `ACTIVE`.

    ## Email notifications

    The service emails the user at the address given at registration:

    | Trigger | Email |
    |---|---|
    | `POST /auth/register` returns `201` | Registered; next step is KYC |
    | `POST /kyc` returns `201` | KYC submitted, awaiting approval |
    | `PUT /kyc` returns `200` | KYC details updated and resubmitted for review |
    | `PATCH /kyc` returns `200` with `APPROVED` | KYC approved, trading account active |
    | `PATCH /kyc` returns `200` with `REJECTED` | KYC not approved, with the rejection reason |

    Delivery is best-effort and asynchronous. A mail failure never changes the HTTP response,
    so clients must not treat a successful response as proof that an email was delivered.

    ## Security rules

    - Store passwords with argon2id or bcrypt at cost 12 or above. Never MD5, never SHA-256, never
      an unsalted hash.
    - Never log a password, a token, or a refresh token, including inside an error object.
    - Return the same response body, the same status and comparable timing for an unknown user and
      for a wrong password. A different response for each is a user enumeration vulnerability.
    - Rotate the refresh token on every refresh, and invalidate the one that was presented. A
      refresh token that is presented twice indicates theft: revoke the whole chain.
    - Validate the signature, the expiry and the issuer on every protected request. Never trust a
      decoded payload that has not had its signature checked.
    - Do not put anything in a JWT that you would not publish. The payload is base64, not encrypted.
    - `POST /auth/admin/register` is **not** guarded by an admin token in the current
      implementation — it is reachable by anyone, exactly like `POST /auth/register`. This is a
      known gap, not an intended design, and is called out here so the contract does not imply a
      protection that does not exist. Lock this down before using it outside a training
      environment.
  contact:
    name: Enterprise Trading Platform, programme materials
  license:
    name: Instructional use only

servers:
  - url: http://localhost:3000
    description: Local development.
  - url: http://auth-service:3000
    description: Service name inside the Docker Compose network.

tags:
  - name: Auth
    description: Registration, login and token lifecycle.
  - name: Profile
    description: The authenticated user.
  - name: KYC
    description: Know-your-customer submission and admin review.

paths:
  /auth/register/otp:
    post:
      tags: [Auth]
      operationId: sendRegistrationOtp
      security: []
      summary: Email a one-time code to verify the address before registering
      description: |
        Emails a 6-digit code to the address. The code is valid for 10 minutes and allows five
        attempts. Another code for the same address can be requested after 60 seconds; a new code
        replaces the previous one. The code itself is never returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          description: A code was sent to this address too recently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cooldown:
                  value:
                    errorCode: OTP-429
                    message: Please wait 42 seconds before requesting a new code.
        '503':
          description: The email could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unavailable:
                  value:
                    errorCode: OTP-503
                    message: We could not send the verification code. Check the email address and try again.

  /auth/register/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyRegistrationOtp
      security: []
      summary: Check the emailed code and receive an email verification token
      description: |
        On success returns a single-use `verificationToken`, valid for 30 minutes, which must be
        sent as `emailVerificationToken` on `POST /auth/register` with the same email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: The code is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong:
                  value:
                    errorCode: OTP-400
                    message: Incorrect verification code. 4 attempts remaining.
        '404':
          description: No code was requested for this email (or it was already used).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The code has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          description: Too many wrong attempts; the code is no longer usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Email a password reset code to the user's registered email address
      description: |
        Looks the user up by username and emails a 6-digit code to the address given at
        registration. Same code rules as `/auth/register/otp` (10 minutes, five attempts, 60-second
        resend cooldown).

        The response is identical whether or not the username exists, and the email is sent in the
        background, so the endpoint cannot be used to discover which usernames are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Always returned for a well-formed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/forgot-password/verify:
    post:
      tags: [Auth]
      operationId: verifyPasswordResetOtp
      security: []
      summary: Check the password reset code and receive a reset token
      description: |
        On success returns a single-use `verificationToken`, valid for 30 minutes, to send as
        `resetToken` on `POST /auth/reset-password`. Errors match `/auth/register/otp/verify`; an
        unknown username gets the same `404 OTP-404` as a username with no pending code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordResetOtpRequest'
      responses:
        '200':
          description: Code accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: The code is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No code was requested for this username (or it was already used).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The code has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          description: Too many wrong attempts; the code is no longer usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      summary: Set a new password using a reset token
      description: |
        Replaces the password, burns the reset token, revokes every refresh token for the user (so
        all existing sessions end) and emails a "password changed" notice. Does not sign the user
        in; the client logs in afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: The reset token is missing, wrong, expired or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    errorCode: OTP-403
                    message: Your password reset session is invalid or has expired. Request a new code.
        '422':
          description: Invalid input, or the new password equals the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Register a user
      description: |
        Creates a user, assigns the `CUSTOMER` role, and publishes a `user-registrations` event so
        the Trade REST API can provision a trading account asynchronously. It does not create the
        trading account itself and does not accept a caller-supplied `accountId`.

        The email must first be verified: call `/auth/register/otp`, then
        `/auth/register/otp/verify`, and send the returned token as `emailVerificationToken`.
        Without a valid token the request is refused with `403 OTP-403` before anything else is
        checked.

        Registration does not return tokens. The client logs in afterwards. Returning a session from
        a registration endpoint makes the endpoint an unauthenticated session factory, and any
        weakness in it becomes an authentication bypass.

        A caller-supplied `roles` field is ignored on this route regardless of what is sent: the
        service always assigns `CUSTOMER`. Use `/auth/admin/register` to create an admin user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                created:
                  value:
                    id: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
                    username: priya.menon
                    roles: [CUSTOMER]
        '403':
          description: |
            `emailVerificationToken` is missing, wrong, expired, already used, or was issued for a
            different email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unverified:
                  value:
                    errorCode: OTP-403
                    message: Email not verified. Verify the code sent to your email before registering.
        '409':
          description: The username (`AUTH-409`) or phone number (`PHONE-409`) is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taken:
                  value:
                    errorCode: AUTH-409
                    message: Username already registered
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/admin/register:
    post:
      tags: [Auth]
      operationId: registerAdmin
      security: []
      summary: Register an admin user
      description: |
        Creates a user with the `ADMIN` role and no linked trading account (`accountId: 0`). Unlike
        `/auth/register`, the created user's status is `ACTIVE` immediately; no KYC/provisioning
        flow applies to admins.

        See the "Security rules" note above: this endpoint currently applies no additional
        authorisation of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Admin user created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                created:
                  value:
                    id: 2b6b1a1e-6b3d-4a6a-9f2e-1a2b3c4d5e6f
                    username: admin.ops
                    accountId: 0
                    roles: [ADMIN]
        '409':
          description: The username (`AUTH-409`) or phone number (`PHONE-409`) is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taken:
                  value:
                    errorCode: AUTH-409
                    message: Username already registered
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in and receive tokens
      description: |
        Verifies the credentials and issues an access token and a refresh token. Every credential
        failure, whatever its cause (unknown username, wrong password, or no trading account
        provisioned yet), returns the same `AUTH-401` body.

        If the credentials are valid but the linked trading account is `BLOCKED` or `CLOSED` (or any
        status other than `PENDING`, `ACTIVE` or `SUSPENDED`), login is refused with `ACC-403`
        instead, and no tokens are issued or rotated.

        A `SUSPENDED` account signs in normally and can read its account, but the Trade REST API
        refuses its orders with `ACC-403` (business rule 2 accepts orders from `ACTIVE` accounts only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  username: priya.menon
                  password: 'correct horse battery staple'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: The linked trading account is blocked or closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                blocked:
                  value:
                    errorCode: ACC-403
                    message: You are blocked from using this service.
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/admin/login:
    post:
      tags: [Auth]
      operationId: loginAdmin
      security: []
      summary: Admin log in and receive tokens
      description: |
        Same credential check as `/auth/login`, plus a check that the user holds the `ADMIN` role.
        A valid customer's credentials presented here fail with `AUTH-401`, the same body as an
        unknown user, so this route does not disclose which accounts are admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      summary: Exchange a refresh token for a new token pair
      description: |
        Consumes the presented refresh token and issues a new pair. The presented token stops working
        immediately. For a customer token, the trading account is looked up again and a missing
        account fails the refresh with `AUTH-401`, the same as login, and an account that is no longer
        allowed to sign in (`BLOCKED`, `CLOSED`) fails it with `ACC-403` and has every one of its
        refresh tokens revoked, so a customer blocked while signed in cannot stay signed in by
        refreshing. An admin token skips the account lookup (`accountId` stays `0`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: The trading account is blocked or closed. Every refresh token it held is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                blocked:
                  value:
                    errorCode: ACC-403
                    message: You are blocked from using this service.
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out and revoke the provided refresh token
      description: |
        Revokes the presented refresh token and ends the session on the client.
        This operation is idempotent from the client's perspective: if the token
        is already revoked or unknown, the endpoint still returns success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out.
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: |
        Returns the user identified by the access token. Protected. The UI calls it after login to
        populate the dashboard greeting and to learn which account to address.

        Read the identity from the verified token, never from a query parameter or a header the
        client controls. Accepting a client-supplied user identifier here is OWASP A01.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /auth/me/contact:
    get:
      tags: [Profile]
      operationId: getMyContact
      summary: Get the authenticated user's contact details
      description: |
        Returns the signed-in user's own email and phone, so the settings screen can show where
        alerts go. Protected; the user comes from the verified token. Kept separate from
        `/auth/me`, which the UI caches, so contact details are read on demand and never stored in
        the browser. The Trade API's preferences hold the alert channel only and refer here rather
        than keeping a copy.
      responses:
        '200':
          description: Where alerts reach this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /kyc:
    get:
      tags: [KYC]
      operationId: getMyKyc
      summary: Get KYC submission for the authenticated user
      description: |
        Requires a `CUSTOMER` token. Returns the signed-in user's submitted KYC
        record. If no submission exists yet, returns `KYC-404`.
      responses:
        '200':
          description: KYC submission found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No KYC submission exists for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    errorCode: KYC-404
                    message: KYC record not found
      security:
        - bearerAuth: []

    post:
      tags: [KYC]
      operationId: submitKyc
      summary: Submit KYC details for the authenticated user
      description: |
        Requires a `CUSTOMER` token; an `ADMIN` token, or one that is not a customer, is refused
        with `AUTH-403`. Exactly one submission is allowed per user — a second `POST` call while
        one already exists (in any status) fails with `KYC-409`. Existing submissions are edited
        via `PUT /kyc`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKycRequest'
      responses:
        '201':
          description: KYC submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
              examples:
                submitted:
                  value:
                    id: 42
                    userId: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
                    status: PENDING
                    dateOfBirth: '1995-04-12'
                    documentType: PASSPORT
                    documentNumber: N1234567
                    submittedAt: '2026-09-30T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            This user has already submitted KYC (`KYC-409`), or another user already registered the
            same document type and number (`DOC-409`; compared ignoring case, spaces and punctuation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadySubmitted:
                  value:
                    errorCode: KYC-409
                    message: KYC already submitted
                documentTaken:
                  value:
                    errorCode: DOC-409
                    message: This document is already registered to another account. Check the document type and number.
        '422':
          $ref: '#/components/responses/InvalidInput'
      security:
        - bearerAuth: []

    put:
      tags: [KYC]
      operationId: updateMyKyc
      summary: Update KYC details for the authenticated user
      description: |
        Requires a `CUSTOMER` token. Updates an existing KYC submission for the
        signed-in user and resets it to `PENDING` for re-review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKycRequest'
      responses:
        '200':
          description: KYC updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No KYC submission exists yet for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    errorCode: KYC-404
                    message: KYC record not found
        '409':
          description: Another user already registered the same document type and number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                documentTaken:
                  value:
                    errorCode: DOC-409
                    message: This document is already registered to another account. Check the document type and number.
        '422':
          $ref: '#/components/responses/InvalidInput'
      security:
        - bearerAuth: []

    patch:
      tags: [KYC]
      operationId: reviewKyc
      summary: Review KYC status (admin only)
      description: |
        Requires an `ADMIN` token. Looks up the KYC submission by the `userId` in the request body,
        not by the caller's own identity, since the caller here is the reviewing admin, not the
        applicant.

        Approving (`status: APPROVED`) calls the Trade REST API to activate the linked trading
        account and returns the new `accountId` in the response. Rejecting does not touch the
        trading account. Reviewing an already-approved submission again fails with `KYC-409`; there
        is no such guard for re-rejecting a rejected one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKycRequest'
      responses:
        '200':
          description: KYC reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
              examples:
                approved:
                  value:
                    id: 42
                    userId: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
                    status: APPROVED
                    dateOfBirth: '1995-04-12'
                    documentType: PASSPORT
                    documentNumber: N1234567
                    submittedAt: '2026-09-30T08:00:00Z'
                    reviewedAt: '2026-09-30T09:00:00Z'
                    reviewedBy: 2b6b1a1e-6b3d-4a6a-9f2e-1a2b3c4d5e6f
                    accountId: 1
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No KYC submission exists for this userId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    errorCode: KYC-404
                    message: KYC record not found
        '409':
          description: This submission has already been approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyApproved:
                  value:
                    errorCode: KYC-409
                    message: KYC already approved
        '422':
          $ref: '#/components/responses/InvalidInput'
      security:
        - bearerAuth: []

  /kyc/pending:
    get:
      tags: [KYC]
      operationId: getPendingKyc
      summary: Get all pending KYC submissions (admin only)
      description: |
        Requires an `ADMIN` token. Returns all `PENDING` KYC records ordered by
        oldest submission first.
      responses:
        '200':
          description: Pending KYC submissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KycResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by `/auth/login`, `/auth/admin/login` or `/auth/refresh`.

  responses:
    Unauthorised:
      description: |
        Authentication failed. Returned for an unknown username, a wrong password, an expired token,
        a wrongly signed token, a consumed refresh token, a malformed header, and (on login/refresh)
        a customer whose trading account has not been provisioned yet. The body is identical in
        every case, on purpose.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    Forbidden:
      description: |
        Authenticated, but not allowed to perform this action (wrong role for the endpoint).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: AUTH-403
                message: Forbidden
    InvalidInput:
      description: The request failed field validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input

  schemas:

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, email, firstName, lastName, phone]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
          example: priya.menon
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Minimum twelve characters. Length beats character-class rules, so do not impose a
            symbol requirement that pushes users towards a shorter password.
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Address for notification emails (registration, KYC submitted, KYC approved or
            rejected). Never returned in any response and never logged. Stored AES-256-GCM
            encrypted at rest.
          writeOnly: true
          example: priya.menon@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          example: Priya
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          example: Menon
        phone:
          type: string
          pattern: '^\\+?[1-9]\\d{7,14}$'
          description: |
            Unique across accounts: a number already registered is refused with `409 PHONE-409`.
            Numbers are compared by digits only, so `+91 98765-43210` and `919876543210` are the
            same number. Stored AES-256-GCM encrypted at rest; uniqueness is checked through a
            keyed lookup hash, never the number itself.
          example: +919876543210
        emailVerificationToken:
          type: string
          maxLength: 128
          description: |
            Token from `POST /auth/register/otp/verify`. Required by `/auth/register`; ignored by
            `/auth/admin/register`.
          writeOnly: true
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
          description: |
            Accepted by the schema but ignored by `/auth/register`, which always assigns
            `CUSTOMER`, and by `/auth/admin/register`, which always assigns `ADMIN`. Kept on the
            request shape only so both endpoints can share one DTO; do not rely on it changing the
            assigned role.
      example:
        username: priya.menon
        password: 'correct horse battery staple'
        email: priya.menon@example.com
        firstName: Priya
        lastName: Menon
        phone: +919876543210

    SendOtpRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: priya.menon@example.com

    SendOtpResponse:
      type: object
      required: [message, expiresIn, resendAfter]
      properties:
        message:
          type: string
          example: A verification code has been sent to your email.
        expiresIn:
          type: integer
          description: Seconds until the code expires.
          example: 600
        resendAfter:
          type: integer
          description: Seconds before another code can be requested.
          example: 60

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: priya.menon@example.com
        otp:
          type: string
          pattern: '^\d{6}$'
          example: '482913'

    VerifyOtpResponse:
      type: object
      required: [verificationToken, expiresIn]
      properties:
        verificationToken:
          type: string
          description: Send as `emailVerificationToken` on `POST /auth/register`.
        expiresIn:
          type: integer
          description: Seconds the token stays valid.
          example: 1800

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          maxLength: 64
          example: priya.menon

    VerifyPasswordResetOtpRequest:
      type: object
      additionalProperties: false
      required: [username, otp]
      properties:
        username:
          type: string
          maxLength: 64
          example: priya.menon
        otp:
          type: string
          pattern: '^\d{6}$'
          example: '482913'

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [username, resetToken, newPassword]
      properties:
        username:
          type: string
          maxLength: 64
          example: priya.menon
        resetToken:
          type: string
          maxLength: 128
          description: The `verificationToken` from `POST /auth/forgot-password/verify`.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      description: |
        Browsers send `{}`: the refresh token travels in the HttpOnly `refresh_token` cookie
        (Path=/auth, Secure, SameSite=Strict) set by login and refresh, and the cookie wins
        when both are present. The body field remains for non-browser clients.
      properties:
        refreshToken:
          type: string
          description: The refresh token issued by the previous login or refresh. Omit it when the refresh_token cookie is sent.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Signed JWT carrying the claims contract described in the service description.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI4ZjE0ZTQ1Zi1jZWVhLTRjMWItOWQzYi0xYTJiM2M0ZDVlNmYifQ.signature
        refreshToken:
          type: string
          description: Opaque, stored server-side, revocable, rotated on every use.
          example: 9c1f7a2e4b6d8e0a2c4e6a8c0e2a4c6e8a0c2e4a6c8e0a2c
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, roles]
      properties:
        id:
          type: string
          format: uuid
          description: The value carried in the `sub` claim.
          example: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
        username:
          type: string
          example: priya.menon
        accountId:
          type: integer
          format: int64
          description: |
            The numeric trading account key, `ACCOUNTS.id`. Absent on the `POST /auth/register`
            response, because the account is provisioned asynchronously and may not exist yet.
            `0` for an admin user, who has no linked trading account. Present and populated on
            `GET /auth/me` once the account exists, since it is read from the verified token.
          example: 1
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
          example: [CUSTOMER]
        createdOn:
          type: string
          format: date-time
          description: Not currently populated by any endpoint; reserved for future use.
          example: '2026-09-30T08:00:00Z'

    ContactResponse:
      type: object
      additionalProperties: false
      required: [email, phone]
      properties:
        email:
          type: string
          format: email
          example: priya.menon@example.com
        phone:
          type: ['string', 'null']
          description: Null when the user registered without a phone number.
          example: '+919876543210'

    Role:
      type: string
      enum: [CUSTOMER, ADMIN]

    CreateKycRequest:
      type: object
      additionalProperties: false
      required: [dateOfBirth, documentType, documentNumber]
      properties:
        dateOfBirth:
          type: string
          format: date
          description: |
            ISO 8601 calendar date. Must not be in the future, otherwise `422 VAL-422` with the
            message "Date of birth cannot be a future date. Select today or an earlier date."
            Stored AES-256-GCM encrypted at rest.
          example: '1995-04-12'
        documentType:
          type: string
          minLength: 2
          maxLength: 50
          description: Stored AES-256-GCM encrypted at rest.
          example: PASSPORT
        documentNumber:
          type: string
          minLength: 3
          maxLength: 100
          description: |
            Document type + number must be unique across users: one already submitted by another
            user is refused with `409 DOC-409`. Compared ignoring case, spaces and punctuation
            (`p 123-4567` equals `P1234567`); the same number under a different document type is
            allowed. Stored AES-256-GCM encrypted at rest; uniqueness is checked through a keyed
            lookup hash, never the number itself.
          example: N1234567

    KycStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    KycReviewStatus:
      type: string
      enum: [APPROVED, REJECTED]
      description: The two outcomes an admin can set. A submission cannot be reviewed back to `PENDING`.

    UpdateKycRequest:
      type: object
      additionalProperties: false
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
          description: The applicant whose submission is being reviewed, not the reviewing admin.
        status:
          $ref: '#/components/schemas/KycReviewStatus'
        rejectionReason:
          type: string
          maxLength: 500
          description: Required by the client when `status` is `REJECTED`; ignored when approving.
      example:
        userId: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
        status: APPROVED

    KycResponse:
      type: object
      additionalProperties: false
      required: [id, userId, status, dateOfBirth, documentType, documentNumber, submittedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/KycStatus'
        dateOfBirth:
          type: string
          format: date
        documentType:
          type: string
        documentNumber:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: ['string', 'null']
          format: date-time
          description: Set once an admin has reviewed the submission; `null` while `PENDING`.
        reviewedBy:
          type: ['string', 'null']
          format: uuid
          description: The reviewing admin's user id; `null` while `PENDING`.
        rejectionReason:
          type: ['string', 'null']
          description: Set only when `status` is `REJECTED`.
        accountId:
          type: integer
          format: int64
          description: |
            Present only in the `PATCH /kyc` response, and only when this review approved the
            submission — it is the trading account's id after activation. Never present on the
            `POST /kyc` response.
          example: 1

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The same envelope the Trade REST API uses, so the Angular UI has one error handler.
      properties:
        errorCode:
          type: string
          enum:
            - AUTH-401
            - AUTH-403
            - AUTH-409
            - ACC-403
            - KYC-404
            - KYC-409
            - PHONE-409
            - DOC-409
            - OTP-400
            - OTP-403
            - OTP-404
            - OTP-410
            - OTP-429
            - OTP-503
            - VAL-422
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `AUTH-401` | 401 | Unauthorised or invalid token |
            | `AUTH-403` | 403 | Authenticated, but the wrong role for this endpoint |
            | `AUTH-409` | 409 | Username already taken |
            | `ACC-403` | 403 | Linked trading account is suspended (login only) |
            | `KYC-404` | 404 | No KYC submission exists for the given user |
            | `KYC-409` | 409 | KYC already submitted, or already approved |
            | `PHONE-409` | 409 | Phone number already registered to another account (register) |
            | `DOC-409` | 409 | Document type + number already registered to another account (KYC) |
            | `OTP-400` | 400 | Wrong verification code; the message says how many attempts remain |
            | `OTP-403` | 403 | Email verification / password reset token missing, wrong, expired or used |
            | `OTP-404` | 404 | No verification code has been requested (or it was already used) |
            | `OTP-410` | 410 | Verification code expired |
            | `OTP-429` | 429 | Resend requested within 60 s, or too many wrong attempts |
            | `OTP-503` | 503 | The verification email could not be sent |
            | `VAL-422` | 422 | Invalid input (the message may be more specific, e.g. a future date of birth) |

            `AUTH-403`, `AUTH-409`, `KYC-404`, `KYC-409`, `PHONE-409`, `DOC-409` and the `OTP-*`
            codes extend the platform error catalogue and are scoped to this service. `ACC-403` is shared with `trade-api.yaml` and carries the
            same meaning.
          example: AUTH-401
        message:
          type: string
          description: |
            Human-readable, for display only. Clients branch on `errorCode`, never on `message`.
            Credential failures stay deliberately vague (`Unauthorised`), because a more helpful
            message tells an attacker which half of the credential pair was wrong.
          example: Unauthorised

security:
  - bearerAuth: []
