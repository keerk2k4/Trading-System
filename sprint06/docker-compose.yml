services:

  postgres:
    image: postgres:17
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
  image: postgres:17
  container_name: trading-migrations
  profiles:
    - platform
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: trading
  volumes:
    - ./migrations:/workspace/migrations
    - ./seed:/workspace/seed
    - ./apply.sh:/workspace/apply.sh
  working_dir: /workspace
  entrypoint: ["/bin/bash", "/workspace/apply.sh"]
  networks:
    - trading-net
    
  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading_system
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge