services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    profiles:
      - platform
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - trading-net

  kafka-topics:
    image: apache/kafka:4.0.0
    container_name: kafka-topics
    profiles:
      - platform
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./scripts/create-topics.sh:/workspace/create-topics.sh:ro
    environment:
      KAFKA_TOPICS_BOOTSTRAP_SERVERS: ${KAFKA_TOPICS_BOOTSTRAP_SERVERS:-kafka:19092}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_TOPICS_BOOTSTRAP_SERVERS:-kafka:19092} --list >/dev/null 2>&1; do sleep 2; done
        /bin/bash /workspace/create-topics.sh
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge
