services:
  postgres:
    image: postgres:17
    container_name: trading-postgres
    profiles:
      - platform
    environment:
      POSTGRES_DB: trading_system
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d trading_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
    image: postgres:17
    container_name: trading-migrations
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: trading_system
    volumes:
      - ./migrations:/workspace/migrations
      - ./seed:/workspace/seed
      - ./apply.sh:/workspace/apply.sh
    working_dir: /workspace
    entrypoint: [/bin/bash, /workspace/apply.sh]
    networks:
      - trading-net

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    profiles:
      - platform
    ports:
      - 8080:8080
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      FAUXNANCE_RETRY_MAX_ATTEMPTS: ${FAUXNANCE_RETRY_MAX_ATTEMPTS}
      FAUXNANCE_RETRY_DELAY_MS: ${FAUXNANCE_RETRY_DELAY_MS}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - trading-net

  trade-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-executor
    profiles:
      - platform
    ports:
      - 8081:8080
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      FAUXNANCE_RETRY_MAX_ATTEMPTS: ${FAUXNANCE_RETRY_MAX_ATTEMPTS}
      FAUXNANCE_RETRY_DELAY_MS: ${FAUXNANCE_RETRY_DELAY_MS}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - trading-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    profiles:
      - platform
    ports:
      - 3000:3000
    environment:      
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    profiles:
      - platform
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - trading-net

  kafka-topics:
    image: apache/kafka:4.0.0
    container_name: kafka-topics
    profiles:
      - platform
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./scripts/create-topics.sh:/workspace/create-topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --list >/dev/null 2>&1; do sleep 2; done
        /bin/bash /workspace/create-topics.sh
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge
