services:
  postgres:
    image: postgres:17
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_system
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d trading_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading-net

  migrations:
    image: postgres:17
    container_name: trading-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: trading_system
    volumes:
      - ./migrations:/workspace/migrations
      - ./seed:/workspace/seed
      - ./apply.sh:/workspace/apply.sh
    working_dir: /workspace
    entrypoint: [/bin/bash, /workspace/apply.sh]
    networks:
      - trading-net

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading_system
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-hmac-sha256-token-signing}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-trade-api-group}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-fnx_dev_CvXEv1ohuj4MUkfZjn0kmyDFguxcvofA}
      FAUXNANCE_RETRY_MAX_ATTEMPTS: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:-3}
      FAUXNANCE_RETRY_DELAY_MS: ${FAUXNANCE_RETRY_DELAY_MS:-500}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-120000}
      USER_REGISTERED_TOPIC: ${USER_REGISTERED_TOPIC:-user-registrations}
      ACCOUNT_PROVISIONING_GROUP: ${ACCOUNT_PROVISIONING_GROUP:-account-provisioning}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      kafka-topics:
        condition: service_completed_successfully
    networks:
      - trading-net

  trade-executor:
    build:
      context: ./trade-executor
      dockerfile: Dockerfile
    container_name: trade-executor
    ports:
      - 8081:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading_system
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-trade-executor-group}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-fnx_dev_CvXEv1ohuj4MUkfZjn0kmyDFguxcvofA}
      FAUXNANCE_RETRY_MAX_ATTEMPTS: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:-3}
      FAUXNANCE_RETRY_DELAY_MS: ${FAUXNANCE_RETRY_DELAY_MS:-500}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      kafka-topics:
        condition: service_completed_successfully
    networks:
      - trading-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - ${PORT:-3000}:3000
    environment:     
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-hmac-sha256-token-signing}
      JWT_ISSUER: auth-service
      DB_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/trading_system
      TRADE_API_URL: ${TRADE_API_URL:-http://spring-boot-app:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      USER_REGISTERED_TOPIC: ${USER_REGISTERED_TOPIC:-user-registrations}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-dev-only-email-encryption-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      kafka-topics:
        condition: service_completed_successfully
    networks:
      - trading-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - trading-net

  kafka-topics:
    image: apache/kafka:4.0.0
    container_name: kafka-topics
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./scripts/create-topics.sh:/workspace/create-topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server $${KAFKA_BOOTSTRAP_SERVER} --list >/dev/null 2>&1; do sleep 2; done
        /bin/bash /workspace/create-topics.sh
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge
